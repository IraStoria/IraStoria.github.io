  <h1>關於我</h1>
<p>IraStoria，作曲與遊戲音訊設計者。長期關注「音樂如何回應互動」：不是把音樂貼在畫面上，而是讓音樂本身有結構地跟著玩家的節奏走。</p>
<p>目前同時在做一款節奏遊戲與自製的 DAW／製譜工具。這個網站收錄作品、可操作的概念展示，以及零散的筆記。</p>
