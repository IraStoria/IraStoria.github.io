<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Section Player · IraStoria</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>
<header class="top">
  <a class="back" href="../../">← IraStoria</a>
  <div class="langs"><button data-lang="zh" class="active">中文</button><button data-lang="en">EN</button></div>
</header>
<main>
  <h1 data-i18n="title"></h1>
  <p class="lead" data-i18n="lead"></p>

  <section class="panel">
    <div class="row">
      <button id="start" class="big" data-i18n="start"></button>
      <span class="status"><span data-i18n="now"></span> <b id="now">—</b></span>
    </div>
    <div class="segs" id="segs"></div>
    <div class="prog" id="prog"><i></i><b></b></div>
    <div class="next" id="next"></div>
    <div class="opts">
      <label><input type="checkbox" id="optExclude" checked> <span data-i18n="opt_exclude"></span></label>
      <label><input type="checkbox" id="optXfade" checked> <span data-i18n="opt_xfade"></span></label>
      <label><input type="checkbox" id="optRules" checked> <span data-i18n="opt_rules"></span></label>
    </div>
    <div class="hist" id="hist"></div>
  </section>

  <section class="explain">
    <h2 data-i18n="how"></h2>
    <ul>
      <li data-i18n="e1"></li>
      <li data-i18n="e2"></li>
      <li data-i18n="e3"></li>
      <li data-i18n="e4"></li>
    </ul>
    <p class="note" data-i18n="note"></p>
  </section>
</main>
<script src="demo.js"></script>
</body>
</html>
