    <article class="card" data-type="{{type}}">
      <div class="card-head">
        <span class="badge badge-{{type}}">{{type_label}}</span>
        <span class="year">{{year}}</span>
      </div>
      <h3 class="card-title">{{title}}</h3>
      <p class="card-desc">{{desc}}</p>
      {{media_block}}
      <div class="card-foot">
        {{platform_note}}
        {{action_links}}
      </div>
    </article>
